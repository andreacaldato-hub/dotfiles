[bar]
order = [ "andrea" ]

    [bar.andrea]
    background_opacity = 0.81999998167157173
    border_width = 1
    capsule = true
    capsule_border_width = 1.5
    capsule_opacity = 0.0
    capsule_padding = 8.0
    center = [ "weather", "date", "media", "privacy" ]
    end = [ "tray", "notifications", "network", "bluetooth", "widget", "battery", "session" ]
    font_family = "Noto Sans"
    margin_edge = 5
    margin_ends = 10
    padding = 22
    radius = 80
    start = [ "workspaces", "network_rx", "network_tx", "cpu", "temp", "audio_visualizer" ]
    thickness = 39

[calendar]
dedupe_events = true
enabled = true

    [calendar.account.personal_google]
    type = "google"

    [calendar.account.polimi]
    type = "google"

[config]

[control_center]
show_session_button = false
sidebar = "full"
sidebar_section = "full"

    [control_center.calendar]
    show_events_location = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
allow_empty_password = true
blur_intensity = 0.99999997764825821
blurred_desktop = true
edge_smoothness = 0.99999997764825821
fingerprint = false
tint_intensity = 0.33999999240040779
transition_duration = 2000

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 336.0
    cx = 968.0
    cy = 635.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.0
        background_radius = 32.0
        center_password_text = true
        input_opacity = 0.0
        input_radius = 32.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = false
        show_login_button = false
        show_media = true
        show_password_reveal = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 208.0
    box_width = 800.0
    cx = 960.0
    cy = 520.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"

[nightlight]
enabled = true
force = true
temperature_day = 10000
temperature_night = 5200

[plugin_settings."blackbartblues/audio-switcher"]
audio-switcher_placement = "floating"
audio-switcher_position = "auto"

[plugin_settings."noctalia/bitwarden"]
clear_clipboard_seconds = 20
gen_special = true
hide_actions_when_searching = true
server_url = "https://vault.bitwarden.com"

[plugin_settings."noctalia/timer"]
panel_placement = "floating"

[plugins]
enabled = [
    "noctalia/wallhaven",
    "blackbartblues/audio-switcher",
    "kenn/keybind-cheatsheet",
    "thaer99ob/default-apps",
    "noctalia/timer",
    "noctalia/bitwarden"
]

[shell]
app_icon_color = "primary"
button_borders = false
card_borders = false
corner_radius_scale = 2.0
external_ip_enabled = true
panel_anchor_bar = "andrea"
password_style = "random"
show_close_buttons = false

    [shell.animation]
    speed = 2.0000000298023224

    [shell.launcher]
    default_view = "all"
    search_position = "top"
    show_app_actions = true
    show_navigation_labels = false
    show_session_button = false
    show_settings_button = false
    width = 650

    [shell.panel]
    control_center_placement = "floating"
    floating_layer = "top"
    list_item_background = true
    session_placement = "floating"
    session_position = "top_right"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.session]
    grid = true
    grid_columns = 2

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Eldritch"
community_palette = "One Dark Warmer"
custom_palette = "ddg-4-1793644823702106947-dys"
pure_black_dark = true
source = "wallpaper"
sync_color_scheme = false
wallpaper_scheme = "dysfunctional"

[wallpaper]
directory = "/home/andrea/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/andrea/Pictures/Wallpapers/wallhaven-1qlj8v.png"

    [wallpaper.last]
    path = "/home/andrea/Pictures/Wallpapers/wallhaven-1qlj8v.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/andrea/Pictures/Wallpapers/wallhaven-1qlj8v.png"

    [[wallpaper.favorite]]
    path = "/home/andrea/Pictures/Wallpapers/ddg_4_1793644838312672974.jpg"

[widget.audio_visualizer]
bands = 11
scale = 1.2000000000000002

[widget.battery]
font_scale = 0.96999999999999997

[widget.clock]
anchor = true

[widget.cpu]
font_scale = 0.95000000000000007
stat = "cpu_freq"

[widget.date]
anchor = true
format = "{:%a %d %b  %H:%M}"

[widget.media]
hide_when_no_media = true

[widget.network]
show_vpn_label = true
vpn_status = "both"

[widget.widget]
type = "blackbartblues/audio-switcher:widget"

[widget.workspaces]
focused_output_only = true
hide_when_empty = true
occupied_color = "outline_variant"
style = "minimal"
