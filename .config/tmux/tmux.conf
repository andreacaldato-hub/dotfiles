
# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

# --- Theme: Sonokai (rounded status style) ---
set -g status-style "bg=#2c2e34,fg=#e2e2e3"
set -g message-style "bg=#2c2e34,fg=#9F7B4C"
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#9F7B4C"
set -g status-style "bg=default,fg=#e2e2e3"

# Window list (no asterisk, clean highlight)
set-option -g window-status-format '#[fg=#5c6370,bold]#W#[default]'
set-option -g window-status-current-format '#[fg=#CAAF5F,bold]#W#[default]'
setw -g window-status-style "bg=default"
setw -g window-status-current-style "bg=default"


# Status bar layout and padding
set -g set-titles on
set -g status-interval 5          # refresh every 5s

set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 500

set -g status-left '#[fg=#5c6370]TMUX▲ #[fg=#8AB667,bold] #S #[default] #[fg=#5c6370]|#[default] '

set -g status-right '#(~/.config/tmux/git-prompt.sh) #[fg=#8BE9FD]%H:%M #[fg=#BD93F9]| #[fg=#FF5555]%Y-%m-%d #[default]'

# --- Keybindings ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 

bind-key x kill-pane
bind-key q kill-window
bind-key k kill-session 
bind m command-prompt "rename-session %%"
set-option -g detach-on-destroy off

bind-key u new-session
bind-key w new-window
bind-key -n C-S-M-h switch-client -p
bind-key -n C-S-M-l switch-client -n
bind n command-prompt -I "#W" "rename-window '%%'"

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


# Open fzf-tmux sessions in a popup
bind -n M-T display-popup -E "zsh -ic fzf-tmux-session"
bind -n M-F display-popup -E "zsh -ic fzf-tmux-switch"
bind -n M-G display-popup -E "zsh -ic fzf-tmux-gitrepo"

# Jump to sessions by number (Alt+1..Alt+9)
bind -n M-1 run-shell "tmux switch-client -t \$(tmux list-sessions -F \"#S\" | sed -n 1p)"
bind -n M-2 run-shell "tmux switch-client -t \$(tmux list-sessions -F \"#S\" | sed -n 2p)"
bind -n M-3 run-shell "tmux switch-client -t \$(tmux list-sessions -F \"#S\" | sed -n 3p)"
bind -n M-4 run-shell "tmux switch-client -t \$(tmux list-sessions -F \"#S\" | sed -n 4p)"
bind -n M-5 run-shell "tmux switch-client -t \$(tmux list-sessions -F \"#S\" | sed -n 5p)"
bind -n M-6 run-shell "tmux switch-client -t \$(tmux list-sessions -F \"#S\" | sed -n 6p)"
bind -n M-7 run-shell "tmux switch-client -t \$(tmux list-sessions -F \"#S\" | sed -n 7p)"
bind -n M-8 run-shell "tmux switch-client -t \$(tmux list-sessions -F \"#S\" | sed -n 8p)"
bind -n M-9 run-shell "tmux switch-client -t \$(tmux list-sessions -F \"#S\" | sed -n 9p)"

bind v split-window -h
bind o split-window -v

# Required for vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim|vimdiff)'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resize panes with prefix + arrow keys
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5

set-option -g mouse on

unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

bind -n M-h previous-window
bind -n M-l next-window
# Previous / Next session
bind -n M-H switch-client -p
bind -n M-L switch-client -n
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloading Tmux"

