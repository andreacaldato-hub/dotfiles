# --- Terminal & Colors ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"

set -s escape-time 0
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

# --- Border & Popup Styles ---
set -g message-style "bg=#09090a,fg=#ffffff"
set -g pane-border-style "fg=#222222"
set -g pane-active-border-style "fg=#777777"
set -g popup-border-style 'fg=#1a1a1a'
set -g popup-border-lines heavy

# --- Status Bar General ---
set -g set-titles on
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 500

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'obergodmar/kanagawa-tmux'

# ─────────────────────────────────────────────────────────────────────────────
# CONFIGURAZIONE STATUS BAR (kanagawa-tmux)
# Scegli una delle OPZIONI riportate nella guida sottostante e incolla qui le righe!
# --- Configurazione kanagawa-tmux ---
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-show-left-icon session
set -g @kanagawa_date_time ""

# Disabilita i colori di sfondo predefiniti del plugin per le finestre
set -g @kanagawa-ignore-window-colors true

# Forza lo sfondo della status bar trasparente
set -g status-style bg=default
set -g status-left-style bg=default
set -g status-right-style bg=default

# Testo/Info della repo a destra
# --- Key bindings ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

bind-key x kill-pane
bind-key q kill-window
bind-key k kill-session
bind-key K run-shell "tmux kill-server && exit"
bind m command-prompt "rename-session %%"
set-option -g detach-on-destroy off

bind-key u new-session
bind-key w new-window
bind-key -n C-S-M-h switch-client -p
bind-key -n C-S-M-l switch-client -n
bind n command-prompt -I "#W" "rename-window '%%'"

# Swap windows
bind-key -n M-! swap-window -t 1
bind-key -n M-@ swap-window -t 2
bind-key -n M-\# swap-window -t 3
bind-key -n M-$ swap-window -t 4
bind-key -n M-% swap-window -t 5
bind-key -n M-^ swap-window -t 6
bind-key -n M-& swap-window -t 7
bind-key -n M-* swap-window -t 8
bind-key -n M-\( swap-window -t 9
bind-key -n M-\) swap-window -t 0

# Popups
bind -n M-T display-popup -w 50% -h 50% -E "zsh -ic tmux-sessionizer"
bind -n M-F display-popup -w 40% -h 30% -E "zsh -ic tmux-switch"
bind -n M-G display-popup -w 50% -h 40% -E "zsh -ic tmux-gitrepo"
bind v split-window -h
bind o split-window -v

# vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim|vimdiff)'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resize panes
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5

set-option -g mouse on

# Prefix
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

bind -n M-h previous-window
bind -n M-l next-window
bind -n M-H switch-client -p
bind -n M-L switch-client -n
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloading Tmux"

run '~/.config/tmux/plugins/tpm/tpm'
