set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0
set -g status-style 'bg=#333333 fg=#5eacd3'
# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

# --- Theme: Sonokai (rounded status style) ---
set -g status-style bg='default'
set -g message-style "bg=#2c2e34,fg=#E6B450"
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#E6B450"

# Window list (no asterisk, clean highlight)
# set-option -g window-status-format '#[fg=#5c6370]#W#[default]'
# set-option -g window-status-current-format '#[fg=#CAAF5F,bold]#W#[default]'
# # Active window
# set -g window-status-current-format '#[fg=#5c6370,bold]#I:#W#[default]'
# # Inactive windows

# Status bar layout and padding
set -g set-titles on
set -g status-interval 1          # refresh every 5s

set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 500

# Measure your status-left length (approx), then add spaces before windows
# set -g status-left '#[fg=#FFFFFF] #S #[fg=#5c6370,bold]|#[default] '
# set -g status-right "#[fg=white,nobold]#(gitmux -cfg $HOME/.config/tmux/gitmux.yml) "
#
# # Window list with manual padding
# set -g window-status-format '#[fg=#5c6370]       #I:#W       #[default]'
# set -g window-status-current-format '#[fg=#CAAF5F,bold]       #I:#W       #[default]'
#
# set -g status-justify left
# Terminal / shell vibes
#   (terminal)
#   (bash)
#   (zsh)
#   (shell)
#
# # Git / coding
#   (branch)
#   (git)
#   (code / dev)
#   (python)
#   (javascript)
#
# # Folders / files
#   (folder)
#   (open folder)
#   (file)
#
# # Fun / status
# 🚀  (rocket)
# ⚡  (lightning)
# ⭐  (star)
# 🔥  (fire)
# ☕  (coffee)
#
# # Alerts / notifications
# ✖  (cross / conflict)
# ✔  (check / clean)
# ⚠  (warning)
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-status-right-text "#[fg=#E2CCA9,nobold,italic]""#(~/dotfiles/.config/tmux/git-prompt.sh)#(gitmux -cfg $HOME/.config/tmux/gitmux.yml || echo '#[fg=#7A6F5A] no-repo') "
set -g @tmux-dotbar-session-text  " ⚡#S "
# set -g @tmux-dotbar-window-status-format " #W "
# supposing you use catppuccin moccha
set -g @tmux-dotbar-position bottom
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg "#585b70"
set -g @tmux-dotbar-fg-current "#CAAF5F,bold"
set -g @tmux-dotbar-fg-session "#E2CCA9"
set -g @tmux-dotbar-fg-prefix "#F2594B"


setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 

bind-key x kill-pane
bind-key q kill-window
bind-key k kill-session 
bind-key K run-shell "tmux kill-server && exit"
bind m command-prompt "rename-session %%"
set-option -g detach-on-destroy off

bind-key u new-session
bind-key w new-window
bind-key -n C-S-M-h switch-client -p
bind-key -n C-S-M-l switch-client -n
bind n command-prompt -I "#W" "rename-window '%%'"

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


# Open fzf-tmux sessions in a popup
# Bigger popup, more usable
# Set popup border and background
set -g popup-border-style 'fg=#1f2329'    # border color
set -g popup-border-lines heavy          # or single, heavy, none
bind -n M-T display-popup -w 50% -h 40% -E "zsh -ic tmux-sessionizer"
bind -n M-F display-popup -w 40% -h 30% -E "zsh -ic tmux-switch"
bind -n M-G display-popup -w 50% -h 40% -E "zsh -ic tmux-gitrepo"
bind v split-window -h
bind o split-window -v

# Required for vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim|vimdiff)'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resize panes with prefix + arrow keys
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5

set-option -g mouse on

unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

bind -n M-h previous-window
bind -n M-l next-window
# Previous / Next session
bind -n M-H switch-client -p
bind -n M-L switch-client -n
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloading Tmux"
set -g status-interval 1   # refresh every 1 second (default is 2 or more)

run '~/.config/tmux/plugins/tpm/tpm'
