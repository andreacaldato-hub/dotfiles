# ── koda.nvim dark ────────────────────────────────────────────────────────────
# bg        #101010   editor background
# line      #1a1a1a   cursorline / surfaces
# dim       #222222   subtle surface
# comment   #50585d   muted / dimmed text
# keyword   #777777   mid-grey (inactive labels, separators)
# fg_dim    #909090   secondary foreground
# fg        #b0b0b0   normal foreground
# emphasis  #d4d4d4   bright text / active items
# ─────────────────────────────────────────────────────────────────────────────

set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

# --- Theme: koda dark ---
set -g status-style bg='default'
set -g message-style "bg=#09090a,fg=#ffffff"
set -g pane-border-style "fg=#222222"
set -g pane-active-border-style "fg=#777777"

# Status bar
set -g set-titles on
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 500
set -g status-left-style 'bg=default'

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'obergodmar/kanagawa-tmux'
# set -g @plugin 'Nybkox/tmux-ukiyo'
# set -g @ukiyo-theme "kanagawa/wave"    # default dark

set -g @tmux-dotbar-right true
set -g @tmux-dotbar-status-right-text "#[fg=#333333]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────#[fg=#ffffff] #(~/dotfiles/.config/tmux/git-prompt.sh | sed 's/.*/#[fg=#6b6b6b,bold]&/')#(gitmux -cfg $HOME/.config/tmux/gitmux.yml 2>/dev/null)#[fg=#e6e2c9]"
#󰣇⚡
set -g @tmux-dotbar-session-text  "󰣇 #S "
set -g @tmux-dotbar-position bottom
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg "#333333"
set -g @tmux-dotbar-fg-current "#ffffff ,bold"
set -g @tmux-dotbar-fg-session "#e6c384"
set -g @tmux-dotbar-fg-prefix "#909090"

# --- Key bindings ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

bind-key x kill-pane
bind-key q kill-window
bind-key k kill-session
bind-key K run-shell "tmux kill-server && exit"
bind m command-prompt "rename-session %%"
set-option -g detach-on-destroy off

bind-key u new-session
bind-key w new-window
bind-key -n C-S-M-h switch-client -p
bind-key -n C-S-M-l switch-client -n
bind n command-prompt -I "#W" "rename-window '%%'"

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind-key -n M-! swap-window -t 1
bind-key -n M-@ swap-window -t 2
bind-key -n M-\# swap-window -t 3
bind-key -n M-$ swap-window -t 4
bind-key -n M-% swap-window -t 5
bind-key -n M-^ swap-window -t 6
bind-key -n M-& swap-window -t 7
bind-key -n M-* swap-window -t 8
bind-key -n M-\( swap-window -t 9
bind-key -n M-\) swap-window -t 0

# Popups
set -g popup-border-style 'fg=#1a1a1a'
set -g popup-border-lines heavy
bind -n M-T display-popup -w 50% -h 50% -E "zsh -ic tmux-sessionizer"
bind -n M-F display-popup -w 40% -h 30% -E "zsh -ic tmux-switch"
bind -n M-G display-popup -w 50% -h 40% -E "zsh -ic tmux-gitrepo"
bind v split-window -h
bind o split-window -v

# vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim|vimdiff)'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resize panes
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5

set-option -g mouse on

unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

bind -n M-h previous-window
bind -n M-l next-window
bind -n M-H switch-client -p
bind -n M-L switch-client -n
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloading Tmux"
set -g status-interval 1

run '~/.config/tmux/plugins/tpm/tpm'

