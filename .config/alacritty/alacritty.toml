# Ayu × Catppuccin blended palette

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "0x101010"
foreground = "0xb0b0b0"

[colors.normal]
black   = "0x1a1a1a"
red     = "0x7a4a4a"
green   = "0x4a6a50"
yellow  = "0x6e5c38"
blue    = "0x3d5068"
magenta = "0x5a4a6a"
cyan    = "0x3d5a58"
white   = "0xb0b0b0"

[colors.bright]
black   = "0x333333"
red     = "0x8a5a5a"
green   = "0x5a7a60"
yellow  = "0x8a7248"
blue    = "0x4d6078"
magenta = "0x6a5a7a"
cyan    = "0x4d6a68"
