[terminal]

shell = "zsh"


[window]

padding         = { x = 15, y = 4 }
opacity         = 0.4
# decorations: "None" for borderless, "Full" for native title bar
# decorations = "Full"


[font]

size              = 14
builtin_box_drawing = true


[font.normal]

family = "JetBrainsMono Nerd Font"
style  = "SemiBold"


[font.bold]

family = "JetBrainsMono Nerd Font"
style  = "SemiBold"


[font.italic]

style = "Italic"


[font.offset]

y = 2  # subtle line spacing


[colors]

draw_bold_text_with_bright_colors = true


[colors.primary]

background = "0x1d1f21"
foreground = "0xc5c8c6"


[colors.cursor]

text   = "0x1d1f21"
cursor = "0xc5c8c6"


[colors.normal]

black   = "0x1d1f21"
red     = "0xcc6666"
green   = "0xb5bd68"
yellow  = "0xe8c56d"
blue    = "0x81a2be"
magenta = "0xb294bb"
cyan    = "0x8abeb7"
white   = "0xc5c8c6"


[colors.bright]

black   = "0x666666"
red     = "0xd54e53"
green   = "0xb9ca4a"
yellow  = "0xe7c547"
blue    = "0x7aa6da"
magenta = "0xc397d8"
cyan    = "0x70c0b1"
white   = "0xeaeaea"

