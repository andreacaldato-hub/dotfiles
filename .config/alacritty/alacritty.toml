[general]

[terminal]

shell = "zsh"


[window]

padding         = { x = 15, y = 8 }
opacity         = 0.5
# decorations: "None" for borderless, "Full" for native title bar
# decorations = "Full"


[font]
size = 14.0

[font.normal]
family = "JetBrains Mono Nerd"
style = "Regular"

[font.bold]
family = "JetBrains Mono Nerd"
style = "Thin Bold"

[font.italic]
family = "JetBrains Mono Nerd"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono Nerd"
style = "Thin Bold Italic"

[font.offset]
y = 3 # subtle line spacing


[colors.primary]
background = '#0D0C0C'
foreground = '#ABB2BF'

[colors.normal]
black   = '#1E2127'
red     = '#E06C75'
green   = '#98C379'
yellow  = '#D19A66'
blue    = '#61AFEF'
magenta = '#C678DD'
cyan    = '#56B6C2'
white   = '#ABB2BF'

[colors.bright]
black   = '#5C6370'
red     = '#E06C75'
green   = '#98C379'
yellow  = '#E5C07B'
blue    = '#61AFEF'
magenta = '#C678DD'
cyan    = '#56B6C2'
white   = '#FFFFFF'

[colors.selection]
text = '#ABB2BF'
background = '#3E4451'

[colors.cursor]
text = '#282C34'
