terminal.shell = "zsh"
[window]
padding = { x = 15, y = 4}
opacity = 0.5

#[window.decorations]
# "None" for borderless, "Full" for native title bar
#value = "Full"

[font]
size = 14
builtin_box_drawing = true
normal = {family = "JetBrainsMono Nerd Font", style = "SemiBold"}
bold = {family = "JetBrainsMono Nerd Font", style = "SemiBold"}
italic = {style = "Italic" }

[font.offset]
y = 2   # subtle line spacing

