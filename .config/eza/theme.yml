# ── koda.nvim dark ────────────────────────────────────────────────────────────
# #101010  bg
# #1a1a1a  line
# #2a2a2a  dim
# #333333  subtle
# #50585d  comment
# #777777  keyword / mid
# #909090  fg_dim
# #b0b0b0  fg
# #d4d4d4  emphasis
# ─────────────────────────────────────────────────────────────────────────────

colourful: true
filekinds:
  normal:       { foreground: "#b0b0b0" }
  directory:    { foreground: "#d4d4d4" }
  symlink:      { foreground: "#909090" }
  pipe:         { foreground: "#333333" }
  block_device: { foreground: "#777777" }
  char_device:  { foreground: "#777777" }
  socket:       { foreground: "#333333" }
  special:      { foreground: "#909090" }
  executable:   { foreground: "#d4d4d4" }
  mount_point:  { foreground: "#b0b0b0" }
perms:
  user_read:         { foreground: "#b0b0b0" }
  user_write:        { foreground: "#909090" }
  user_execute_file: { foreground: "#d4d4d4" }
  user_execute_other:{ foreground: "#d4d4d4" }
  group_read:        { foreground: "#909090" }
  group_write:       { foreground: "#777777" }
  group_execute:     { foreground: "#b0b0b0" }
  other_read:        { foreground: "#777777" }
  other_write:       { foreground: "#50585d" }
  other_execute:     { foreground: "#909090" }
  special_user_file: { foreground: "#50585d" }
  special_other:     { foreground: "#333333" }
  attribute:         { foreground: "#50585d" }
size:
  major:       { foreground: "#d4d4d4" }
  minor:       { foreground: "#b0b0b0" }
  number_byte: { foreground: "#b0b0b0" }
  number_kilo: { foreground: "#d4d4d4" }
  number_mega: { foreground: "#d4d4d4" }
  number_giga: { foreground: "#909090" }
  number_huge: { foreground: "#777777" }
  unit_byte:   { foreground: "#777777" }
  unit_kilo:   { foreground: "#909090" }
  unit_mega:   { foreground: "#909090" }
  unit_giga:   { foreground: "#777777" }
  unit_huge:   { foreground: "#50585d" }
users:
  user_you:   { foreground: "#d4d4d4" }
  user_root:  { foreground: "#909090" }
  user_other: { foreground: "#777777" }
  group_yours:{ foreground: "#b0b0b0" }
  group_root: { foreground: "#909090" }
  group_other:{ foreground: "#777777" }
links:
  normal:         { foreground: "#909090" }
  multi_link_file:{ foreground: "#b0b0b0" }
git:
  new:        { foreground: "#d4d4d4" }
  modified:   { foreground: "#b0b0b0" }
  deleted:    { foreground: "#50585d" }
  renamed:    { foreground: "#909090" }
  typechange: { foreground: "#909090" }
  ignored:    { foreground: "#333333" }
  conflicted: { foreground: "#777777" }
git_repo:
  branch_main: { foreground: "#777777" }
  branch_other:{ foreground: "#909090" }
  git_clean:   { foreground: "#1a1a1a" }
  git_dirty:   { foreground: "#b0b0b0" }
security_context:
  colon: { foreground: "#2a2a2a" }
  user:  { foreground: "#50585d" }
  role:  { foreground: "#777777" }
  typ:   { foreground: "#50585d" }
  range: { foreground: "#909090" }
file_type:
  image:      { foreground: "#b0b0b0" }
  video:      { foreground: "#d4d4d4" }
  music:      { foreground: "#b0b0b0" }
  lossless:   { foreground: "#d4d4d4" }
  crypto:     { foreground: "#50585d" }
  document:   { foreground: "#b0b0b0" }
  compressed: { foreground: "#777777" }
  temp:       { foreground: "#333333" }
  compiled:   { foreground: "#50585d" }
  build:      { foreground: "#909090" }
  source:     { foreground: "#b0b0b0" }
punctuation:        { foreground: "#2a2a2a" }
date:               { foreground: "#777777" }
inode:              { foreground: "#50585d" }
blocks:             { foreground: "#50585d" }
header:             { foreground: "#d4d4d4" }
octal:              { foreground: "#777777" }
flags:              { foreground: "#909090" }
symlink_path:       { foreground: "#909090" }
control_char:       { foreground: "#50585d" }
broken_symlink:     { foreground: "#333333" }
broken_path_overlay:{ foreground: "#333333" }

